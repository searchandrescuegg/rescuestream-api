app = "rescuestream-api"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8080"
  METRICS_PORT = "8081"
  LOG_LEVEL = "info"
  METRICS_ENABLED = "true"
  TRACING_ENABLED = "true"
  TRACING_SERVICE = "rescuestream-api"
  TAILSCALE_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[metrics]
  port = 8081
  path = "/metrics"

# Secrets are provisioned via `flyctl secrets set` and are NOT declared here:
#   DATABASE_URL (Neon pooler endpoint, for request handlers)
#   SUPER_ADMIN_EMAILS
#   DEVICE_KEY_PEPPER
#   DEVICE_KEY_PEPPER_PREV (optional, during rotation windows)
#   SESSION_SECRET_PEPPER
#   MEDIAMTX_WEBHOOK_SECRET
#   TAILSCALE_AUTHKEY
#   MEDIAMTX_API_URL (tailnet hostname, e.g. http://rescuestream-mediamtx.<tailnet>.ts.net:9997)
#   OTEL_EXPORTER_OTLP_ENDPOINT
#
# Schema migrations are NEVER run on container boot. Operators run `just migrate-prod`
# against Neon's non-pooled endpoint (DATABASE_MIGRATION_URL) before `flyctl deploy`.
# See specs/003-multi-tenant-platform/tasks.md T115a for the runbook.
